name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job adds what Pages needs.
permissions:
  contents: read

# Never run two Pages deployments at once, and let an in-flight deploy finish
# rather than cancelling it half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from the root package.json `packageManager` field,
      # which is the single source of truth; passing `version` too can conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs consume the package's compiled output (theme.css + components),
      # so the workspace packages must be built before the docs site.
      - name: Build packages
        run: pnpm build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # BASE_PATH comes from the Pages action so the base path always matches
      # the actual deployment subpath (e.g. /sawitSvelte for a project page).
      - name: Build docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter @sawitsvelte/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the prerendered site, not the repository.
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
